services:
  engine:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PYTHONPATH=/app
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends libglib2.0-0 libsm6 libxext6 libxrender1 libgl1 &&
      pip install --no-cache-dir opencv-python-headless numpy pillow fastapi 'uvicorn[standard]' pydantic python-multipart httpx &&
      python -m uvicorn engine.api.main:app --host 0.0.0.0 --port 8001 --reload --reload-dir engine"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: on-failure

  gateway:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PORT=8000
      - ENGINE_URL=http://engine:8001
    command: sh -c "cd gateway && npm install && node server.js"
    ports:
      - "3000:8000"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: on-failure
